version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: greenbox-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: greenbox
    volumes:
      - mongo-data:/data/db
      - ./catalog/mongo/init:/docker-entrypoint-initdb.d:ro

  mongo-adapter:
    build: ./catalog/mongo
    container_name: greenbox-mongo-adapter
    restart: unless-stopped
    environment:
      MONGO_URI: "mongodb://root:rootpassword@mongo:27017/"
      MONGO_DB: "greenbox"
    ports:
      - "8082:8082"
    depends_on:
      - mongo

  influxdb:
    image: influxdb:2
    container_name: greenbox-influxdb
    restart: unless-stopped
    profiles:
      - influx
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: greenbox
      DOCKER_INFLUXDB_INIT_BUCKET: greenbox
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb2

  influx-adapter:
    build:
      context: .
      dockerfile: catalog/influx/Dockerfile
    container_name: greenbox-influx-adapter
    restart: unless-stopped
    profiles:
      - influx
    environment:
      INFLUXDB_URL: "http://influxdb:8086"
      INFLUXDB_TOKEN: "my-super-secret-auth-token"
      INFLUXDB_ORG: "greenbox"
      INFLUXDB_BUCKET: "greenbox"
    ports:
      - "8087:8086"
    depends_on:
      - influxdb

  catalog:
    build:
      context: .
      dockerfile: catalog/Dockerfile
    container_name: greenbox-catalog
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGO_ADAPTER_URL: "http://mongo-adapter:8082"
      INFLUX_ADAPTER_URL: "http://influx-adapter:8086"
      CATALOG_PORT: 8080
      CATALOG_IP: "0.0.0.0"
      CATALOG_HOST: "0.0.0.0"
    depends_on:
      - mongo-adapter
      

volumes:
  mongo-data:
  influxdb-data: