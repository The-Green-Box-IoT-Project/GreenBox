services:
  control-strategies:
    build:
      context: ..
      dockerfile: ./controller/Dockerfile
    container_name: control-strategies
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - mongo_default
      - influx_caronte

networks:
  mongo_default:
    external: true
  influx_caronte:
    external: true  