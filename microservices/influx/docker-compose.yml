networks:
  caronte: {}

volumes:
  influxdb3_data: {}
  influxdb3_plugins: {}
  grafana_data: {}
  mosquitto_data: {}
  mosquitto_log: {}

configs:
  telegraf_config:
    file: ./telegraf.conf

  mosquitto_config:
    content: |
      listener 1883 0.0.0.0
      allow_anonymous true
      persistence true
      persistence_location /mosquitto/data/
      log_dest stdout

services:
  influx-adapter:
    build: .
    container_name: influx-adapter
    ports: ["8186:8081"]
    networks: [caronte]
    environment:
      - INFLUXDB_URL=http://influxdb3:8181
      - INFLUXDB_BUCKET=greenbox
    depends_on: [influxdb3]
    restart: unless-stopped

  influxdb3:
    container_name: influxdb3
    image: influxdb:3-core
    command: >
      influxdb3 serve
      --node-id=node0
      --object-store=file
      --data-dir=/var/lib/influxdb3/data
      --plugin-dir=/var/lib/influxdb3/plugins
      --without-auth  
    ports: ["8181:8181"]
    volumes:
      - influxdb3_data:/var/lib/influxdb3/data
      - influxdb3_plugins:/var/lib/influxdb3/plugins
    networks: [caronte]
    restart: unless-stopped
    user: "0:0"

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    configs:
      - source: mosquitto_config
        target: /mosquitto/config/mosquitto.conf
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks: [caronte]
    restart: unless-stopped

  telegraf:
    container_name: telegraf
    image: telegraf:1.30
    depends_on: [mosquitto, influxdb3]
    configs:
      - source: telegraf_config
        target: /etc/telegraf/telegraf.conf
    networks: [caronte]
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana
    ports: ["3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [caronte]
    depends_on: [influxdb3]
    restart: unless-stopped
