[[outputs.http]]
  url = "http://influxdb3:8181/api/v3/write_lp?db=greenbox&precision=ns"
  method = "POST"
  data_format = "influx"

# Actuator data consumer (json_v2)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["/+/+/actuators/+/+/data"]
  data_format = "json_v2"
  name_override = "actuator_data"
  topic_tag = "greenhouse_id.raspberry_id"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "system"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "level"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "energy_consumption"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "water_consumption"

# Sensor data consumer (original)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "/+/+/sensors/+/+"
  ]
  data_format = "json"
  json_string_fields = ["unit", "sensor", "metric", "site", "device"]
  tag_keys = ["unit", "sensor", "metric", "site", "device"]
  name_override = "sensor_data"