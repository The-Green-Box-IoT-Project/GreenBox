services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: greenbox
    volumes:
      - mongo-data:/data/db
      - ./init:/docker-entrypoint-initdb.d:ro
    command: ["mongod","--bind_ip_all"]
    networks:
      - influx_caronte

  mongo-adapter:
    build: ./
    container_name: mongo-adapter
    restart: unless-stopped
    environment:
      MONGO_URI: "mongodb://root:rootpassword@mongo:27017/"
      MONGO_DB: "greenbox"
      BROKER_IP: "mosquitto"
      BROKER_PORT: "1883"
      ENABLE_STRATEGY_NOTIFIER: "1"
      STRATEGY_POLL_S: "1.0"
    ports:
      - "8182:8082"
    depends_on:
      - mongo  
    networks:
      - influx_caronte 

volumes:
  mongo-data:

networks:
  influx_caronte:
    external: true