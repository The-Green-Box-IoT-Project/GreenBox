services:
  statistics:
    build:
      context: ..
      dockerfile: ./statistics/Dockerfile
    container_name: statistics
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - mongo_default
      - influx_caronte

networks:
  mongo_default:
    external: true
  influx_caronte:
    external: true  
